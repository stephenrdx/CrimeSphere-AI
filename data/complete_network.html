<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f4f6f8;

    color: #212529;

}

.header {

    height: 70px;

    background: #1f2937;

    color: white;

    display: flex;

    align-items: center;

    padding: 0 25px;

    font-size: 23px;

    font-weight: bold;

}

.container {

    display: flex;

    height: calc(100vh - 70px);

}

.graph-area {

    flex: 1;

    background: white;

    overflow: auto;

    position: relative;

}

#graph {

    width: 1400px;

    height: 850px;

}

.side-panel {

    width: 350px;

    background: #ffffff;

    border-left: 1px solid #ddd;

    padding: 20px;

    overflow-y: auto;

}

.side-panel h2 {

    margin-top: 0;

    font-size: 20px;

}

.info-box {

    background: #f8f9fa;

    border: 1px solid #ddd;

    border-radius: 8px;

    padding: 12px;

    margin-bottom: 15px;

}

.info-row {

    padding: 6px 0;

    border-bottom: 1px solid #eee;

    font-size: 13px;

}

.info-row:last-child {

    border-bottom: none;

}

.info-key {

    font-weight: bold;

    color: #495057;

}

.legend {

    position: absolute;

    top: 15px;

    left: 15px;

    background: rgba(255,255,255,0.95);

    padding: 12px;

    border-radius: 8px;

    border: 1px solid #ddd;

    z-index: 10;

}

.legend-title {

    font-weight: bold;

    margin-bottom: 8px;

}

.legend-item {

    display: flex;

    align-items: center;

    margin: 5px 0;

    font-size: 13px;

}

.legend-color {

    width: 14px;

    height: 14px;

    border-radius: 50%;

    margin-right: 8px;

}

button {

    border: none;

    background: #343a40;

    color: white;

    padding: 8px 14px;

    border-radius: 5px;

    cursor: pointer;

    margin-bottom: 10px;

}

button:hover {

    background: #212529;

}

svg {

    background: white;

}

.edge {

    stroke-width: 0.7;

    opacity: 0.45;

}

.node {

    cursor: pointer;

}

.node:hover {

    stroke: #000;

    stroke-width: 2;

}

.node-label {

    font-size: 10px;

    pointer-events: none;

    fill: #343a40;

}

.relationship {

    font-size: 8px;

    fill: #6c757d;

    pointer-events: none;

}

.selected {

    stroke: #000;

    stroke-width: 3;

}

</style>

</head>

"http://www.w3.org/2000/svg";


// ============================================================
// DRAW EDGES
// ============================================================

edges.forEach(edge => {

    const source =
        nodeMap[edge.source];

    const target =
        nodeMap[edge.target];

    if (!source || !target) {
        return;
    }


    const line =
        document.createElementNS(
            NS,
            "line"
        );


    line.setAttribute(
        "x1",
        source.x
    );

    line.setAttribute(
        "y1",
        source.y
    );

    line.setAttribute(
        "x2",
        target.x
    );

    line.setAttribute(
        "y2",
        target.y
    );


    line.setAttribute(
        "stroke",
        edge.color
    );


    line.setAttribute(
        "stroke-width",
        "0.7"
    );


    line.setAttribute(
        "opacity",
        "0.45"
    );


    line.classList.add("edge");


    svg.appendChild(line);

});


// ============================================================
// DRAW NODES
// ============================================================

nodes.forEach(node => {

    const group =
        document.createElementNS(
            NS,
            "g"
        );


    group.classList.add("node");


    const circle =
        document.createElementNS(
            NS,
            "circle"
        );


    circle.setAttribute(
        "cx",
        node.x
    );


    circle.setAttribute(
        "cy",
        node.y
    );


    circle.setAttribute(
        "r",
        node.type === "Person"
            ? 8
            : 6
    );


    circle.setAttribute(
        "fill",
        node.color
    );


    circle.setAttribute(
        "stroke",
        "#ffffff"
    );


    circle.setAttribute(
        "stroke-width",
        "1"
    );


    group.appendChild(circle);


    const label =
        document.createElementNS(
            NS,
            "text"
        );


    label.setAttribute(
        "x",
        node.x + 10
    );


    label.setAttribute(
        "y",
        node.y + 3
    );


    label.classList.add(
        "node-label"
    );


    label.textContent =
        node.label;


    group.appendChild(label);


    group.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            selectNode(node.id);

        }
    );


    svg.appendChild(group);

});


// ============================================================
// NODE SELECTION
// ============================================================

function selectNode(nodeId) {

    const node =
        nodeMap[nodeId];


    if (!node) {
        return;
    }


    // Remove previous selection

    document
        .querySelectorAll(".selected")
        .forEach(element => {

            element.classList.remove(
                "selected"
            );

        });


    // Find selected node

    const circles =
        document.querySelectorAll(
            ".node circle"
        );


    circles.forEach(circle => {

        const cx =
            parseFloat(
                circle.getAttribute("cx")
            );

        const cy =
            parseFloat(
                circle.getAttribute("cy")
            );


        if (
            Math.abs(cx - node.x) < 0.1 &&
            Math.abs(cy - node.y) < 0.1
        ) {

            circle.classList.add(
                "selected"
            );

        }

    });


    showNodeInformation(node);

}


// ============================================================
// SHOW INFORMATION
// ============================================================

function showNodeInformation(node) {

    const panel =
        document.getElementById(
            "nodeInfo"
        );


    let html = "";


    html +=
        '<div class="info-box">';


    html +=
        '<div class="info-row">' +
        '<span class="info-key">' +
        'Node ID: ' +
        '</span>' +
        node.id +
        '</div>';


    html +=
        '<div class="info-row">' +
        '<span class="info-key">' +
        'Type: ' +
        '</span>' +
        node.type +
        '</div>';


    for (
        const [key, value]
        of Object.entries(
            node.information
        )
    ) {

        if (
            key === "id" ||
            key === "type"
        ) {
            continue;
        }


        html +=
            '<div class="info-row">' +
            '<span class="info-key">' +
            escapeHtml(key) +
            ': ' +
            '</span>' +
            escapeHtml(value) +
            '</div>';

    }


    html +=
        '</div>';


    // Relationships

    const relationships =
        edges.filter(edge =>
            edge.source === node.id ||
            edge.target === node.id
        );


    html +=
        '<h3>Relationships</h3>';


    if (relationships.length === 0) {

        html +=
            '<p>No relationships found.</p>';

    } else {

        relationships
            .slice(0, 50)
            .forEach(edge => {

                const other =
                    edge.source === node.id
                        ? edge.target
                        : edge.source;


                html +=
                    '<div class="info-box">' +

                    '<div class="info-row">' +

                    '<span class="info-key">' +
                    'Connected To: ' +
                    '</span>' +

                    escapeHtml(other) +

                    '</div>' +

                    '<div class="info-row">' +

                    '<span class="info-key">' +
                    'Relationship: ' +
                    '</span>' +

                    escapeHtml(
                        edge.relationship
                    ) +

                    '</div>' +

                    '</div>';

            });

    }


    panel.innerHTML = html;

}


// ============================================================
// CLEAR SELECTION
// ============================================================

function clearSelection() {

    document
        .querySelectorAll(".selected")
        .forEach(element => {

            element.classList.remove(
                "selected"
            );

        });


    document.getElementById(
        "nodeInfo"
    ).innerHTML =
        "Click a node to see information.";

}


// ============================================================
// HTML ESCAPE
// ============================================================

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ============================================================
// CLICK EMPTY AREA
// ============================================================

svg.addEventListener(
    "click",
    function() {

        clearSelection();

    }
);


</script>


</body>

</html>
